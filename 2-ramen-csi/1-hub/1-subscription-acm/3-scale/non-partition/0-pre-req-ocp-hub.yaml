apiVersion: v1
kind: Namespace
metadata:
  name: scale-non-partition-dr

---
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  name: ramen1
  namespace: scale-non-partition-dr
spec:
  clusterSet: ramen1

---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: scale-non-partition-dr-app-placement-1
  namespace: scale-non-partition-dr
  annotations:
    cluster.open-cluster-management.io/experimental-scheduling-disable: "true"
spec:
  clusterSets:
    - ramen1
  numberOfClusters: 1
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            name: ramen-ocp1

---
apiVersion: ramendr.openshift.io/v1alpha1
kind: DRPolicy
metadata:
  name: ramen-policy-1-2-scale-non-partition
spec:
  drClusters:
    - ramen-ocp1
    - ramen-ocp2
  replicationClassSelector:
    matchLabels:
      ramendr.openshift.io/replication-class: ibm-block-csi-replication-scale-non-partition
  schedulingInterval: 5m

---
apiVersion: ramendr.openshift.io/v1alpha1
kind: DRPlacementControl
metadata:
  name: scale-non-partition-dr-drpc
  namespace: scale-non-partition-dr
spec:
  preferredCluster: ramen-ocp1
  drPolicyRef:
    name: ramen-policy-1-2-scale-non-partition
  placementRef:
    kind: Placement
    name: scale-non-partition-dr-app-placement-1
  pvcSelector:
    matchLabels:
      appname: scale-non-partition-dr

---
apiVersion: app.k8s.io/v1beta1
kind: Application
metadata:
  name: scale-non-partition-dr-app
  namespace: scale-non-partition-dr
spec:
  componentKinds:
    - group: apps.open-cluster-management.io
      kind: Subscription
  descriptor: {}
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - scale-non-partition-dr-app

---
apiVersion: apps.open-cluster-management.io/v1
kind: Subscription
metadata:
  annotations:
    apps.open-cluster-management.io/git-branch: main
    apps.open-cluster-management.io/git-path: 1-workload/3-scale/non-partition
    apps.open-cluster-management.io/reconcile-option: merge
  labels:
    app: scale-non-partition-dr-app
  name: scale-non-partition-dr-sub-1
  namespace: scale-non-partition-dr
spec:
  channel: ggithubcom-parthraaj-ramen-dr-test-ns/ggithubcom-parthraaj-ramen-dr-test
  placement:
    placementRef:
      kind: Placement
      name: scale-non-partition-dr-app-placement-1