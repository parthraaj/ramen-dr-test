# =============================================================================
# HUB CLUSTER RESOURCES
# =============================================================================

# -----------------------------------------------------------------------
# 1. ManagedCluster, one per managed cluster
# Registers the cluster with the hub via ACM import. Referenced indirectly
# by every scenario's Placement, through the clusterset label below.
# -----------------------------------------------------------------------
apiVersion: cluster.open-cluster-management.io/v1
kind: ManagedCluster
metadata:
  name: ramen-ocp1
  labels:
    cluster.open-cluster-management.io/clusterset: ramen1
    name: ramen-ocp1
spec:
  hubAcceptsClient: true

---
apiVersion: cluster.open-cluster-management.io/v1
kind: ManagedCluster
metadata:
  name: ramen-ocp2
  labels:
    cluster.open-cluster-management.io/clusterset: ramen1
    name: ramen-ocp2
spec:
  hubAcceptsClient: true

---
# -----------------------------------------------------------------------
# 2. ManagedClusterSet, cluster scoped
# Groups the two ManagedClusters above using their clusterset label.
# Referenced by every scenario's Placement.spec.clusterSets and
# ManagedClusterSetBinding.spec.clusterSet.
# -----------------------------------------------------------------------
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSet
metadata:
  name: ramen1
spec:
  clusterSelector:
    selectorType: ExclusiveClusterSetLabel

---
# -----------------------------------------------------------------------
# 3. DRCluster, one per managed cluster, cluster scoped
# Ramen's own cluster registration. Points at the S3 profile this cluster
# uses for VRG and PV metadata backup. Referenced by every scenario's
# DRPolicy.spec.drClusters.
# -----------------------------------------------------------------------
apiVersion: ramendr.openshift.io/v1alpha1
kind: DRCluster
metadata:
  name: ramen-ocp1
  labels:
    cluster.open-cluster-management.io/backup: ramen
spec:
  s3ProfileName: minio-s3-ramen-ocp1

---
apiVersion: ramendr.openshift.io/v1alpha1
kind: DRCluster
metadata:
  name: ramen-ocp2
  labels:
    cluster.open-cluster-management.io/backup: ramen
spec:
  s3ProfileName: minio-s3-ramen-ocp2

---
# -----------------------------------------------------------------------
# 4. RamenConfig, delivered as a ConfigMap read by the Ramen Hub Operator
# Cluster wide settings. Defines the S3 profile list that the two
# DRClusters above reference by name.
# -----------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: ramen-hub-operator-config
  namespace: openshift-operators
  labels:
    app: ramen-hub
    cluster.open-cluster-management.io/backup: ramen
data:
  ramen_manager_config.yaml: |
    apiVersion: ramendr.openshift.io/v1alpha1
    kind: RamenConfig
    ramenControllerType: dr-hub
    ramenOpsNamespace: openshift-dr-ops
    multiNamespace:
      FeatureEnabled: true
      volsyncSupported: true
    kubeObjectProtection:
      veleroNamespaceName: openshift-adp
    s3StoreProfiles:
      - s3ProfileName: minio-s3-ramen-ocp1
        s3Bucket: ramen-ocp1-bucket
        s3CompatibleEndpoint: http://minio-http-minio-storage.apps.shirly-ramen-ocp-hub-1.xiv.ibm.com
        s3Region: us-east-1
        s3SecretRef:
          name: ramen-s3-secret
          namespace: openshift-operators
      - s3ProfileName: minio-s3-ramen-ocp2
        s3Bucket: ramen-ocp2-bucket
        s3CompatibleEndpoint: http://minio-http-minio-storage.apps.shirly-ramen-ocp-hub-1.xiv.ibm.com
        s3Region: us-east-1
        s3SecretRef:
          name: ramen-s3-secret
          namespace: openshift-operators

---
# -----------------------------------------------------------------------
# 5. Channel, Git source referenced by every scenario's Subscription
# One shared channel for the entire ramen-dr-samples repository, used by
# spec.channel on every Subscription across all scenarios and modes.
# -----------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: ggithubcom-parthraaj-ramen-dr-test-ns

---
apiVersion: apps.open-cluster-management.io/v1
kind: Channel
metadata:
  name: ggithubcom-parthraaj-ramen-dr-test
  namespace: ggithubcom-parthraaj-ramen-dr-test-ns
spec:
  type: Git
  pathname: https://github.com/parthraaj/ramen-dr-test