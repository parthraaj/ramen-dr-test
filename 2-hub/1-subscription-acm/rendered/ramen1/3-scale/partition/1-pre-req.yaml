---
apiVersion: v1
kind: Namespace
metadata:
  name: scale-partition-dr
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  annotations:
    cluster.open-cluster-management.io/experimental-scheduling-disable: "true"
  name: scale-partition-dr-app-placement-1
  namespace: scale-partition-dr
spec:
  clusterSets:
  - ramen1
  numberOfClusters: 1
  predicates:
  - requiredClusterSelector:
      labelSelector:
        matchLabels:
          name: ramen-ocp1
---
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  name: ramen1
  namespace: scale-partition-dr
spec:
  clusterSet: ramen1
---
apiVersion: ramendr.openshift.io/v1alpha1
kind: DRPolicy
metadata:
  name: ramen-policy-1-2-scale-partition
spec:
  drClusters:
  - ramen-ocp1
  - ramen-ocp2
  replicationClassSelector:
    matchLabels:
      ramendr.openshift.io/replication-class: ibm-block-csi-replication-scale-partition
  schedulingInterval: 5m
