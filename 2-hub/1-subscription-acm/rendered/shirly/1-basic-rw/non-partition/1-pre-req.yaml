---
apiVersion: v1
kind: Namespace
metadata:
  name: basic-rw-non-partition-dr
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  annotations:
    cluster.open-cluster-management.io/experimental-scheduling-disable: "true"
  name: basic-rw-non-partition-dr-shirly-app-placement-1
  namespace: basic-rw-non-partition-dr
spec:
  clusterSets:
  - ramen-shirly
  numberOfClusters: 1
  predicates:
  - requiredClusterSelector:
      labelSelector:
        matchLabels:
          name: shirly-ramen-ocp-dr1
---
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  name: ramen-shirly
  namespace: basic-rw-non-partition-dr
spec:
  clusterSet: ramen-shirly
---
apiVersion: ramendr.openshift.io/v1alpha1
kind: DRPolicy
metadata:
  name: ramen-policy-shirly-basic-rw-non-partition
spec:
  drClusters:
  - shirly-ramen-ocp-dr1
  - shirly-ramen-ocp-dr2
  replicationClassSelector:
    matchLabels:
      ramendr.openshift.io/replication-class: ibm-block-csi-replication-basic-rw-non-partition
  schedulingInterval: 5m
