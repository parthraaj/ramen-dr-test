apiVersion: app.k8s.io/v1beta1
kind: Application
metadata:
  name: PLACEHOLDER-APP-NAME
  namespace: PLACEHOLDER-NS
spec:
  componentKinds:
    - group: apps.open-cluster-management.io
      kind: Subscription
  descriptor: {}
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - PLACEHOLDER-APP-NAME

---
apiVersion: apps.open-cluster-management.io/v1
kind: Subscription
metadata:
  annotations:
    apps.open-cluster-management.io/git-branch: main
    apps.open-cluster-management.io/git-path: PLACEHOLDER-GIT-PATH
    apps.open-cluster-management.io/reconcile-option: merge
  labels:
    app: PLACEHOLDER-APP-NAME
  name: PLACEHOLDER-SUB-NAME
  namespace: PLACEHOLDER-NS
spec:
  channel: ggithubcom-parthraaj-ramen-dr-test-ns/ggithubcom-parthraaj-ramen-dr-test
  placement:
    placementRef:
      kind: Placement
      name: PLACEHOLDER-PLACEMENT-NAME
