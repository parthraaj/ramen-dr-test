apiVersion: v1
kind: Namespace
metadata:
  name: argocd-basic-rw-partition-dr
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ocm-placement-consumer
  namespace: openshift-gitops
rules:
- apiGroups:
  - cluster.open-cluster-management.io
  resources:
  - placementdecisions
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ocm-placement-consumer
  namespace: openshift-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ocm-placement-consumer
subjects:
- kind: ServiceAccount
  name: openshift-gitops-applicationset-controller
  namespace: openshift-gitops
---
apiVersion: v1
data:
  apiVersion: cluster.open-cluster-management.io/v1beta1
  kind: placementdecisions
  matchKey: clusterName
  statusListKey: decisions
kind: ConfigMap
metadata:
  labels:
    cluster.open-cluster-management.io/placement: argocd-basic-rw-partition-shirly-appset
  name: argocd-basic-rw-partition-shirly-appset
  namespace: openshift-gitops
---
apiVersion: apps.open-cluster-management.io/v1beta1
kind: GitOpsCluster
metadata:
  name: argocd-basic-rw-partition-shirly-gitops-cluster
  namespace: openshift-gitops
spec:
  argoServer:
    argoNamespace: openshift-gitops
    cluster: local-cluster
  placementRef:
    apiVersion: cluster.open-cluster-management.io/v1beta1
    kind: Placement
    name: argocd-basic-rw-partition-shirly-appset
    namespace: openshift-gitops
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: argocd-basic-rw-partition-shirly-appset
  namespace: openshift-gitops
spec:
  generators:
  - clusterDecisionResource:
      configMapRef: argocd-basic-rw-partition-shirly-appset
      labelSelector:
        matchLabels:
          cluster.open-cluster-management.io/placement: argocd-basic-rw-partition-shirly-appset
      requeueAfterSeconds: 30
  template:
    metadata:
      name: argocd-basic-rw-partition-shirly-{{name}}
    spec:
      destination:
        namespace: argocd-basic-rw-partition-dr
        server: '{{server}}'
      project: default
      source:
        path: 3-workload/2-argocd/1-basic-rw/partition
        repoURL: https://github.com/parthraaj/ramen-dr-test
        targetRevision: main
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        - PruneLast=true
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  annotations:
    cluster.open-cluster-management.io/experimental-scheduling-disable: "true"
  labels:
    cluster.open-cluster-management.io/placement: argocd-basic-rw-partition-shirly-appset
  name: argocd-basic-rw-partition-shirly-appset
  namespace: openshift-gitops
spec:
  clusterSets:
  - ramen-shirly
  numberOfClusters: 1
  predicates:
  - requiredClusterSelector:
      labelSelector:
        matchLabels:
          name: shirly-ramen-ocp-dr1
---
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  name: ramen-shirly
  namespace: openshift-gitops
spec:
  clusterSet: ramen-shirly
---
apiVersion: ramendr.openshift.io/v1alpha1
kind: DRPlacementControl
metadata:
  name: argocd-basic-rw-partition-dr-shirly-drpc
  namespace: argocd-basic-rw-partition-dr
spec:
  drPolicyRef:
    name: ramen-policy-shirly-argocd-basic-rw-partition
  placementRef:
    kind: Placement
    name: argocd-basic-rw-partition-shirly-appset
    namespace: openshift-gitops
  preferredCluster: shirly-ramen-ocp-dr1
  pvcSelector:
    matchLabels:
      appname: argocd-basic-rw-partition-dr
---
apiVersion: ramendr.openshift.io/v1alpha1
kind: DRPolicy
metadata:
  name: ramen-policy-shirly-argocd-basic-rw-partition
spec:
  drClusters:
  - shirly-ramen-ocp-dr1
  - shirly-ramen-ocp-dr2
  replicationClassSelector:
    matchLabels:
      ramendr.openshift.io/replication-class: ibm-block-csi-replication-argocd-basic-rw-partition
  schedulingInterval: 5m
