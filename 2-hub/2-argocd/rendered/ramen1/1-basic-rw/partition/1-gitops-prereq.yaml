---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd-basic-rw-partition-dr
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ocm-placement-consumer
  namespace: openshift-gitops
rules:
- apiGroups:
  - cluster.open-cluster-management.io
  resources:
  - placementdecisions
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ocm-placement-consumer
  namespace: openshift-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ocm-placement-consumer
subjects:
- kind: ServiceAccount
  name: openshift-gitops-applicationset-controller
  namespace: openshift-gitops
---
apiVersion: v1
data:
  apiVersion: cluster.open-cluster-management.io/v1beta1
  kind: placementdecisions
  matchKey: clusterName
  statusListKey: decisions
kind: ConfigMap
metadata:
  labels:
    cluster.open-cluster-management.io/placement: argocd-basic-rw-partition-appset
  name: argocd-basic-rw-partition-appset
  namespace: openshift-gitops
---
apiVersion: apps.open-cluster-management.io/v1beta1
kind: GitOpsCluster
metadata:
  name: argocd-basic-rw-partition-gitops-cluster
  namespace: openshift-gitops
spec:
  argoServer:
    argoNamespace: openshift-gitops
    cluster: local-cluster
  placementRef:
    apiVersion: cluster.open-cluster-management.io/v1beta1
    kind: Placement
    name: argocd-basic-rw-partition-appset
    namespace: openshift-gitops
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  annotations:
    cluster.open-cluster-management.io/experimental-scheduling-disable: "true"
  labels:
    cluster.open-cluster-management.io/placement: argocd-basic-rw-partition-appset
  name: argocd-basic-rw-partition-appset
  namespace: openshift-gitops
spec:
  clusterSets:
  - ramen1
  numberOfClusters: 1
  predicates:
  - requiredClusterSelector:
      labelSelector:
        matchLabels:
          name: ramen-ocp1
---
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  name: ramen1
  namespace: openshift-gitops
spec:
  clusterSet: ramen1
---
apiVersion: ramendr.openshift.io/v1alpha1
kind: DRPolicy
metadata:
  name: ramen-policy-1-2-argocd-basic-rw-partition
spec:
  drClusters:
  - ramen-ocp1
  - ramen-ocp2
  replicationClassSelector:
    matchLabels:
      ramendr.openshift.io/replication-class: ibm-block-csi-replication-argocd-basic-rw-partition
  schedulingInterval: 5m
