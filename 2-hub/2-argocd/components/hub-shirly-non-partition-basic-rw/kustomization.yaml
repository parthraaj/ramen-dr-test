apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: Namespace
    patch: |-
      - op: replace
        path: /metadata/name
        value: argocd-basic-rw-non-partition-dr
  - target:
      kind: ManagedClusterSetBinding
    patch: |-
      - op: replace
        path: /metadata/name
        value: ramen-shirly
      - op: replace
        path: /spec/clusterSet
        value: ramen-shirly
  - target:
      kind: Placement
    patch: |-
      - op: replace
        path: /metadata/name
        value: argocd-basic-rw-non-partition-shirly-appset
      - op: replace
        path: /metadata/labels/cluster.open-cluster-management.io~1placement
        value: argocd-basic-rw-non-partition-shirly-appset
      - op: replace
        path: /spec/clusterSets/0
        value: ramen-shirly
      - op: replace
        path: /spec/predicates/0/requiredClusterSelector/labelSelector/matchLabels/name
        value: shirly-ramen-ocp-dr1
  - target:
      kind: ConfigMap
    patch: |-
      - op: replace
        path: /metadata/name
        value: argocd-basic-rw-non-partition-shirly-appset
      - op: replace
        path: /metadata/labels/cluster.open-cluster-management.io~1placement
        value: argocd-basic-rw-non-partition-shirly-appset
  - target:
      kind: GitOpsCluster
    patch: |-
      - op: replace
        path: /metadata/name
        value: argocd-basic-rw-non-partition-shirly-gitops-cluster
      - op: replace
        path: /spec/placementRef/name
        value: argocd-basic-rw-non-partition-shirly-appset
  - target:
      kind: DRPolicy
    patch: |-
      - op: replace
        path: /metadata/name
        value: ramen-policy-shirly-argocd-basic-rw-non-partition
      - op: replace
        path: /spec/drClusters/0
        value: shirly-ramen-ocp-dr1
      - op: replace
        path: /spec/drClusters/1
        value: shirly-ramen-ocp-dr2
      - op: replace
        path: /spec/replicationClassSelector/matchLabels/ramendr.openshift.io~1replication-class
        value: ibm-block-csi-replication-argocd-basic-rw-non-partition
  - target:
      kind: DRPlacementControl
    patch: |-
      - op: replace
        path: /metadata/name
        value: argocd-basic-rw-non-partition-dr-shirly-drpc
      - op: replace
        path: /metadata/namespace
        value: argocd-basic-rw-non-partition-dr
      - op: replace
        path: /spec/preferredCluster
        value: shirly-ramen-ocp-dr1
      - op: replace
        path: /spec/drPolicyRef/name
        value: ramen-policy-shirly-argocd-basic-rw-non-partition
      - op: replace
        path: /spec/placementRef/name
        value: argocd-basic-rw-non-partition-shirly-appset
      - op: replace
        path: /spec/pvcSelector/matchLabels/appname
        value: argocd-basic-rw-non-partition-dr
  - target:
      kind: ApplicationSet
    patch: |-
      - op: replace
        path: /metadata/name
        value: argocd-basic-rw-non-partition-shirly-appset
      - op: replace
        path: /spec/generators/0/clusterDecisionResource/configMapRef
        value: argocd-basic-rw-non-partition-shirly-appset
      - op: replace
        path: /spec/generators/0/clusterDecisionResource/labelSelector/matchLabels/cluster.open-cluster-management.io~1placement
        value: argocd-basic-rw-non-partition-shirly-appset
      - op: replace
        path: /spec/template/metadata/name
        value: 'argocd-basic-rw-non-partition-shirly-{{name}}'
      - op: replace
        path: /spec/template/spec/source/path
        value: 3-workload/2-argocd/1-basic-rw/non-partition
      - op: replace
        path: /spec/template/spec/destination/namespace
        value: argocd-basic-rw-non-partition-dr
