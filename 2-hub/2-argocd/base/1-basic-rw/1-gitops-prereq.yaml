apiVersion: v1
kind: Namespace
metadata:
  name: PLACEHOLDER-NS
---
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  name: PLACEHOLDER-CLUSTERSET
  namespace: openshift-gitops
spec:
  clusterSet: PLACEHOLDER-CLUSTERSET
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: PLACEHOLDER-APPSET-NAME
  namespace: openshift-gitops
  labels:
    cluster.open-cluster-management.io/placement: PLACEHOLDER-APPSET-NAME
  annotations:
    cluster.open-cluster-management.io/experimental-scheduling-disable: "true"
spec:
  numberOfClusters: 1
  clusterSets:
    - PLACEHOLDER-CLUSTERSET
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            name: PLACEHOLDER-PREFERRED-CLUSTER
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: PLACEHOLDER-APPSET-NAME
  namespace: openshift-gitops
  labels:
    cluster.open-cluster-management.io/placement: PLACEHOLDER-APPSET-NAME
data:
  apiVersion: "cluster.open-cluster-management.io/v1beta1"
  kind: "placementdecisions"
  statusListKey: "decisions"
  matchKey: "clusterName"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ocm-placement-consumer
  namespace: openshift-gitops
rules:
  - apiGroups: ["cluster.open-cluster-management.io"]
    resources: ["placementdecisions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ocm-placement-consumer
  namespace: openshift-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ocm-placement-consumer
subjects:
  - kind: ServiceAccount
    namespace: openshift-gitops
    name: openshift-gitops-applicationset-controller
---
apiVersion: apps.open-cluster-management.io/v1beta1
kind: GitOpsCluster
metadata:
  name: PLACEHOLDER-GITOPSCLUSTER-NAME
  namespace: openshift-gitops
spec:
  argoServer:
    cluster: local-cluster
    argoNamespace: openshift-gitops
  placementRef:
    kind: Placement
    apiVersion: cluster.open-cluster-management.io/v1beta1
    name: PLACEHOLDER-APPSET-NAME
    namespace: openshift-gitops
