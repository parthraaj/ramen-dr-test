apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: Namespace
      name: argocd-basic-rw
    patch: |-
      - op: replace
        path: /metadata/name
        value: argocd-basic-rw-non-partition-dr
  - target:
      kind: Secret
      name: secret-argocd-basic-rw
    patch: |-
      - op: replace
        path: /metadata/name
        value: secret-argocd-basic-rw-non-partition-dr
      - op: replace
        path: /metadata/namespace
        value: argocd-basic-rw-non-partition-dr
  - target:
      kind: StorageClass
      name: sc-argocd-basic-rw
    patch: |-
      - op: replace
        path: /metadata/name
        value: sc-argocd-basic-rw-non-partition-dr
      - op: replace
        path: /metadata/labels/ramendr.openshift.io~1replicationid
        value: ibm-block-csi-replication-argocd-basic-rw-non-partition
      - op: replace
        path: /parameters/volume_group
        value: parth-ramen-argocd-basic-rw-non-partition-dr
      - op: replace
        path: /parameters/csi.storage.k8s.io~1provisioner-secret-name
        value: secret-argocd-basic-rw-non-partition-dr
      - op: replace
        path: /parameters/csi.storage.k8s.io~1provisioner-secret-namespace
        value: argocd-basic-rw-non-partition-dr
      - op: replace
        path: /parameters/csi.storage.k8s.io~1controller-publish-secret-name
        value: secret-argocd-basic-rw-non-partition-dr
      - op: replace
        path: /parameters/csi.storage.k8s.io~1controller-publish-secret-namespace
        value: argocd-basic-rw-non-partition-dr
  - target:
      kind: VolumeReplicationClass
      name: vrclass-argocd-basic-rw
    patch: |-
      - op: replace
        path: /metadata/name
        value: vrclass-argocd-basic-rw-non-partition-dr
      - op: replace
        path: /metadata/labels/ramendr.openshift.io~1replicationid
        value: ibm-block-csi-replication-argocd-basic-rw-non-partition
      - op: replace
        path: /metadata/labels/ramendr.openshift.io~1replication-class
        value: ibm-block-csi-replication-argocd-basic-rw-non-partition
      - op: replace
        path: /spec/parameters/replication.storage.openshift.io~1replication-secret-name
        value: secret-argocd-basic-rw-non-partition-dr
      - op: replace
        path: /spec/parameters/replication.storage.openshift.io~1replication-secret-namespace
        value: argocd-basic-rw-non-partition-dr
