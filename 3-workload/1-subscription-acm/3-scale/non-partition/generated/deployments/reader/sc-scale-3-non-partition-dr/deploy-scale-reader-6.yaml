apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-scale-reader-6
  labels:
    appname: scale-non-partition-dr
spec:
  replicas: 1
  selector:
    matchLabels:
      app-key: deploy-scale-reader-6
  template:
    metadata:
      labels:
        app-key: deploy-scale-reader-6
        appname: scale-non-partition-dr
        scale-test: spread
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              scale-test: spread
      containers:
        - name: busybox
          image: quay.io/nirsof/busybox:stable
          command: ["tail", "-f", "/dev/null"]
          volumeMounts:
            - name: data1
              mountPath: /data1
            - name: data2
              mountPath: /data2
      volumes:
        - name: data1
          persistentVolumeClaim:
            claimName: pvc-scale-17
        - name: data2
          persistentVolumeClaim:
            claimName: pvc-scale-18
